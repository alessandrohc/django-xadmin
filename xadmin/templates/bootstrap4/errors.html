{% if form_summary_errors %}
    <div class="alert alert-block alert-danger">
        {% if form_error_title %}<h6 class="alert-heading">{{ form_error_title }}</h6>{% endif %}
        <ul class="m-0">
            {{ form_summary_errors|unordered_list }}
        </ul>
    </div>
{% elif form.non_field_errors %}
    <div class="alert alert-block alert-danger">
        {% if form_error_title %}<h6 class="alert-heading">{{ form_error_title }}</h6>{% endif %}
        <ul class="m-0">
            {{ form.non_field_errors|unordered_list }}
        </ul>
    </div>
{% endif %}
