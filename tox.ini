# https://tox.readthedocs.io/en/latest/
# pip install tox  (python3)
# cd django-xadmin
# tox -r  (run CI tests)
#
# The envlist mirrors what the package declares: Django 4.2 through 5.2 on Python 3.10
# through 3.14. matrix.sh runs the three corners inside the project container; this runs
# the full grid wherever the interpreters are available.
#
# Note the entry point: runtests.py at the repo root, NOT tests/runtests.py. The legacy
# harness cannot run on modern Django -- it calls run_tests(..., extra_tests=[]), an
# argument removed in Django 5.0.

[tox]
minversion = 3.5.2
envlist = py{310,311,312,313,314}-django{42,50,51,52}
skip_missing_interpreters = true

[testenv]
deps =
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django-crispy-forms==2.4
    crispy-bootstrap4==2025.6
    django-import-export==3.3.9
    django-reversion==5.1.0
    django-formtools==2.5.1
commands =
    python runtests.py {posargs}

# Same thing with coverage; open htmlcov/index.html afterwards.
[testenv:coverage]
basepython = python3.10
deps =
    {[testenv]deps}
    Django>=4.2,<5.0
    coverage
commands =
    - coverage erase
    coverage run runtests.py
    - coverage html
